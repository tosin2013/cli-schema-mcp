[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli_schema_mcp"]

[project]
name = "cli-schema-mcp"
version = "0.1.0"
description = "Version-pinned CLI flag schema MCP server — eliminates AI flag hallucination for oc, kubectl, helm, and more"
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["mcp", "cli", "schema", "openshift", "kubectl", "fastmcp", "ai-grounding"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp==2.14.2",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.15.0",
    "structlog==25.4.0",
    "python-dotenv==1.2.4",
    "fastapi==0.116.0",
    "uvicorn==0.35.0",
    "asyncpg==0.30.0",
    "psycopg==3.2.3",
    "itsdangerous==2.2.0",
    "requests-oauthlib==2.0.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pytest-cov==6.2.1",
    "ruff==0.12.2",
    "mypy==1.16.1",
    "pre-commit==4.6.2",
    "httpx==0.28.1",
    "langchain-google-genai==2.1.8",
    "langchain_mcp_adapters==0.1.8",
    "langgraph==0.5.4",
    "bandit==1.9.4",
    "safety",
    "pydocstyle"
]

[project.scripts]
cli-schema-mcp = "cli_schema_mcp.src.main:main"

[project.urls]
Homepage = "https://github.com/tosin2013/cli-schema-mcp"
Repository = "https://github.com/tosin2013/cli-schema-mcp"
Issues = "https://github.com/tosin2013/cli-schema-mcp/issues"
Changelog = "https://github.com/tosin2013/cli-schema-mcp/releases"

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["E", "W", "F", "I"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["cli_schema_mcp"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = ["asyncio"]

[tool.coverage.run]
source = ["cli_schema_mcp"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
