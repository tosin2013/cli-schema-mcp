name: virtctl
display_name: "KubeVirt CLI"
description: "CLI for managing KubeVirt virtual machines on Kubernetes/OpenShift"
binary: virtctl
adapter: cobra
versions:
  - "1.8"
  - "1.9"
version_command: "virtctl version --client"
version_parse: "Client Version: version.Info{GitVersion:\"v{version}"
upstream_repo: "https://github.com/kubevirt/kubevirt"
maintainers:
  - "community"
obtain:
  version_url: "https://api.github.com/repos/kubevirt/kubevirt/releases?per_page=10"
  version_match: "v({version}\\.\\d+)[^\"-]"
  artifact_url: "https://github.com/kubevirt/kubevirt/releases/download/v{resolved}/virtctl-v{resolved}-linux-amd64"
  format: "raw"
  binary: "virtctl"
  skip_checksum: true
