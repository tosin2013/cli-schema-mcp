name: helm
display_name: "Helm"
description: "The Kubernetes package manager (CNCF graduated)"
binary: helm
adapter: cobra
versions:
  - "4.2"
  - "4.3"
version_command: "helm version --short"
version_parse: "v{version}"
upstream_repo: "https://github.com/helm/helm"
maintainers:
  - "community"
# NOTE: helm has a very large command tree. The extractor caps at _MAX_NODES=500 unique
# command paths (~16 MB per version), which covers the main workflows (install, upgrade,
# rollback, template, lint, repo, search, show, package, test, etc.) but not every
# deeply-nested subcommand combination. If you need fuller coverage, run the extractor
# locally with a higher _MAX_NODES and serve it via SCHEMA_REGISTRY_PATH.
# See CONTRIBUTING.md — "Schema size and the node cap" for details.
obtain:
  version_url: "https://api.github.com/repos/helm/helm/releases?per_page=10"
  version_match: "v({version}\\.\\d+)[^\"-]"
  artifact_url: "https://get.helm.sh/helm-v{resolved}-linux-amd64.tar.gz"
  checksum_url: "https://get.helm.sh/helm-v{resolved}-linux-amd64.tar.gz.sha256sum"
  format: "tar.gz"
  binary: "linux-amd64/helm"
