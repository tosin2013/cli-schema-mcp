name: helm
display_name: "Helm"
description: "The Kubernetes package manager (CNCF graduated)"
binary: helm
adapter: cobra
versions:
  - "4.2"
  - "4.3"
version_command: "helm version --short"
version_parse: "v{version}"
upstream_repo: "https://github.com/helm/helm"
maintainers:
  - "community"
obtain:
  version_url: "https://api.github.com/repos/helm/helm/releases?per_page=10"
  version_match: "v({version}\\.\\d+)[^\"-]"
  artifact_url: "https://get.helm.sh/helm-v{resolved}-linux-amd64.tar.gz"
  checksum_url: "https://get.helm.sh/helm-v{resolved}-linux-amd64.tar.gz.sha256sum"
  format: "tar.gz"
  binary: "linux-amd64/helm"
