name: Publish schemas OCI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish schema registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install oras
        uses: oras-project/setup-oras@v2

      - name: Log in to quay.io
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | oras login quay.io \
            -u "${{ secrets.QUAY_USERNAME }}" \
            --password-stdin

      - name: Package and push schemas
        run: |
          tag="${GITHUB_REF_NAME}"
          tar -czf schemas.tar.gz -C schemas .
          oras push \
            "quay.io/takinosh/cli-schema-mcp:${tag}" \
            schemas.tar.gz:application/vnd.cli-schema-mcp.schemas.v1.tar+gzip
          oras push \
            "quay.io/takinosh/cli-schema-mcp:latest" \
            schemas.tar.gz:application/vnd.cli-schema-mcp.schemas.v1.tar+gzip
